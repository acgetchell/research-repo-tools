[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "research-repo-tools"
version = "0.2.5"
description = "Shared maintenance and validation for research software repositories"
readme = "README.md"
requires-python = ">=3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Adam Getchell", email = "adam@adamgetchell.org"}]
dependencies = ["packaging>=26.1", "PyYAML>=6", "rust-just==1.59.0"]

[project.optional-dependencies]
notebooks = ["ipykernel>=7.3.0,<8", "nbclient>=0.11.0,<1", "nbformat>=5.10.4,<6"]
papers = ["pypdf>=6,<7"]
python-tools = ["pytest==9.1.1", "ruff==0.16.9", "ty==0.0.84"]
semgrep = ["semgrep==1.182.1"]

[project.scripts]
research-repo-tools = "research_repo_tools.cli:main"

[project.urls]
Documentation = "https://github.com/acgetchell/research-repo-tools/blob/main/README.md"
Repository = "https://github.com/acgetchell/research-repo-tools"
Issues = "https://github.com/acgetchell/research-repo-tools/issues"

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "coverage==7.17.0",
    "ipykernel==7.4.0",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "pytest-cov==7.1.0",
    "research-repo-tools[papers,python-tools,semgrep]",
    "twine==7.0.0",
    "zizmor==1.31.1",
]
audit = ["pip-audit==2.10.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_repo_tools"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "scripts", "pyproject.toml", "uv.lock", "README.md", "CONTRIBUTING.md", "AGENTS.md", "CHANGELOG.md", "CITATION.cff", "LICENSE", "justfile", ".gitattributes", ".gitleaks.toml", ".python-version"]

[tool.uv]
required-version = "==0.13.6"
override-dependencies = ["jsonschema==4.26.0", "mcp==1.30.0", "opentelemetry-api==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1", "opentelemetry-instrumentation-requests==0.66b1", "opentelemetry-instrumentation-threading==0.66b1", "opentelemetry-sdk==1.45.1", "pywin32==312; sys_platform == 'win32'", "tomli==2.5.0"]

[tool.research-repo-tools.changelog]
owner = "acgetchell"
repository = "research-repo-tools"
date-source = "citation"
citation = "CITATION.cff"

[tool.research-repo-tools.release]
date-policy = "declared"
required-files = ["CITATION.cff"]

[tool.research-repo-tools.publishing]
registry = "pypi"
package = "research-repo-tools"
repository = "acgetchell/research-repo-tools"
required-checks = [
    {name = "check (ubuntu-24.04)", app-id = 15368},
    {name = "check (macos-15)", app-id = 15368},
    {name = "check (windows-2025)", app-id = 15368},
    {name = "changelog-integration", app-id = 15368},
    {name = "release-evidence", app-id = 15368},
]
required-assets = ["research_repo_tools-{version}-py3-none-any.whl", "research_repo_tools-{version}.tar.gz", "release-attestation.json"]

[tool.research-repo-tools.zizmor]
persona = "regular"

[tool.research-repo-tools.toolchain.binaries]
gitleaks = "8.30.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["*/tests/*", "*/.venv/*"]
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
include = ["src/research_repo_tools/*", "scripts/*"]
include_namespace_packages = true
show_missing = true

[tool.ruff]
target-version = "py315"
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

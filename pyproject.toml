[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "research-repo-tools"
version = "0.1.0"
description = "Shared maintenance and validation for research software repositories"
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Adam Getchell", email = "adam@adamgetchell.org"}]
dependencies = ["packaging>=26.1", "PyYAML>=6", "rust-just==1.58.0"]

[project.scripts]
research-repo-tools = "research_repo_tools.cli:main"

[project.urls]
Documentation = "https://github.com/acgetchell/research-repo-tools/blob/main/README.md"
Repository = "https://github.com/acgetchell/research-repo-tools"
Issues = "https://github.com/acgetchell/research-repo-tools/issues"

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.24",
    "coverage==7.16.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "ty==0.0.82",
    "zizmor==1.30.1",
]
audit = ["pip-audit==2.10.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_repo_tools"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "scripts", "pyproject.toml", "uv.lock", "README.md", "CONTRIBUTING.md", "AGENTS.md", "CHANGELOG.md", "LICENSE", "justfile", ".python-version"]

[tool.uv]
required-version = "==0.12.16"

[tool.research-repo-tools.changelog]
owner = "acgetchell"
repository = "research-repo-tools"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["*/tests/*", "*/.venv/*"]
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
include = ["src/research_repo_tools/*", "scripts/*"]
include_namespace_packages = true
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

name: Package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-id:
        description: Immutable artifact containing the validated wheel and sdist
        value: ${{ jobs.build.outputs.artifact-id }}

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: "pyproject.toml"
      - name: Build release distributions once
        run: uv run --locked just build publish-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: Upload immutable distributions
        id: distributions
        with:
          name: distributions-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  source:
    needs: build
    # Required checks must fail, rather than skip, if the shared build failed.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        include:
          - os: ubuntu-24.04
            test-recipe: coverage
          - os: macos-15
            test-recipe: test
          - os: windows-2025
            test-recipe: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Require successful distribution build
        if: needs.build.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: "pyproject.toml"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked
      - name: Provision the stable compiler for packaged documentation regressions
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Verify native Semgrep startup with synthetic input
        run: uv run --locked pytest tests/semgrep/test_native_semgrep.py -k native_engine_reports --cov --cov-report=term
      - name: Verify native dependency provenance
        run: uv run --locked just release-dependency-builds
      - name: Verify native Windows process byte transport
        if: runner.os == 'Windows'
        run: >-
          uv run --locked python -c "import sys, unittest; from tests.cargo_examples.public_cargo_examples_consumer import TestLiveProcess;
          suite = unittest.TestSuite(TestLiveProcess('test_separate_stream_markers_large_chunks_and_exact_bytes') for _ in range(20));
          result = unittest.TextTestRunner(verbosity=2, failfast=True).run(suite); sys.exit(not result.wasSuccessful())"
      - name: Provision native pkg-config discovery test prerequisite
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends pkg-config
          else
            brew install pkgconf
          fi
      - name: Retrieve distributions by immutable ID
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_ARTIFACT: ${{ needs.build.outputs.artifact-id }}
        run: uv run --locked --no-sync python scripts/release_assets.py consume --artifact "$DISTRIBUTION_ARTIFACT"
        shell: bash
      - name: Validate source policy
        run: uv run --locked just check
      # The source test recipes forward trailing arguments to pytest.
      - name: Run source tests
        run: uv run --locked just ${{ matrix.test-recipe }}
      - name: Retain coverage even when later checks fail
        if: ${{ !cancelled() && runner.os == 'Linux' && hashFiles('coverage/cobertura.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/cobertura.xml
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  distributions:
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Require successful distribution build
        if: needs.build.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: "pyproject.toml"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked
      - name: Provision the stable compiler for packaged documentation regressions
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - name: Provision native pkg-config discovery test prerequisite
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends pkg-config
          else
            brew install pkgconf
          fi
      - name: Retrieve distributions by immutable ID
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_ARTIFACT: ${{ needs.build.outputs.artifact-id }}
        run: uv run --locked --no-sync python scripts/release_assets.py consume --artifact "$DISTRIBUTION_ARTIFACT"
        shell: bash
      - name: Validate installed distributions
        run: uv run --locked just check-dist

  setup:
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Require successful distribution build
        if: needs.build.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: "pyproject.toml"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked
      - name: Retrieve distributions by immutable ID
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_ARTIFACT: ${{ needs.build.outputs.artifact-id }}
        run: uv run --locked --no-sync python scripts/release_assets.py consume --artifact "$DISTRIBUTION_ARTIFACT"
        shell: bash
      - name: Reuse managed Cargo compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rrt-cargo-build
          key: cargo-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/check_setup.py', 'src/research_repo_tools/toolchain.py', 'justfile') }}
      - name: Exercise native setup and Cargo updates from the built wheel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Cache compilation only; the harness still creates empty installation homes.
          RESEARCH_REPO_TOOLS_CARGO_BUILD_HOME: ${{ runner.temp }}/rrt-cargo-build
        run: uv run --locked --no-sync --no-python-downloads just check-setup

  check:
    # Preserve branch-protection names; every gate requires all native stages.
    needs: [build, source, distributions, setup]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all native validation stages
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          DISTRIBUTIONS_RESULT: ${{ needs.distributions.result }}
          SETUP_RESULT: ${{ needs.setup.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SOURCE_RESULT" = success
          test "$DISTRIBUTIONS_RESULT" = success
          test "$SETUP_RESULT" = success

  codecov:
    name: Upload coverage
    needs: [build, source]
    # Upload the Linux report even if a later native check failed.
    # Release validation retains reports but does not depend on Codecov availability.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref_type != 'tag' && github.repository == 'acgetchell/research-repo-tools' }}
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/codecov.yml

  changelog-integration:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful distribution build
        if: needs.build.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: "pyproject.toml"
      - name: Retrieve distributions by immutable ID
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_ARTIFACT: ${{ needs.build.outputs.artifact-id }}
        run: uv run --locked python scripts/release_assets.py consume --artifact "$DISTRIBUTION_ARTIFACT"
      - name: Validate, install the pinned generator, and exercise source and installed contracts
        run: uv run --locked just check changelog-setup changelog-test check-dist-changelog

  release-evidence:
    needs: [build, source, distributions, setup, check, changelog-integration]
    # Only protected main pushes may produce release-eligible validation evidence.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'acgetchell/research-repo-tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: "pyproject.toml"
      - name: Install the project-pinned Python
        run: uv python install
      - name: Capture successful producer and native validation identities
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_ARTIFACT: ${{ needs.build.outputs.artifact-id }}
        run: uv run --no-project --no-python-downloads python -I -S scripts/release_assets.py seal --artifact "$DISTRIBUTION_ARTIFACT"
      - name: Sign original main validation evidence
        id: validation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: validation.json
          create-storage-record: false
      - name: Retain original signed evidence for release promotion
        env:
          VALIDATION_BUNDLE: ${{ steps.validation.outputs.bundle-path }}
        run: cp "$VALIDATION_BUNDLE" validation.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-evidence-${{ github.run_attempt }}
          path: |
            validation.json
            validation.sigstore.json
          if-no-files-found: error
          retention-days: 30

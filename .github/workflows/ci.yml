name: Package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-id:
        description: Immutable artifact containing the validated wheel and sdist
        value: ${{ jobs.build.outputs.artifact-id }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "pyproject.toml"
          python-version: "3.14"
      - name: Build release distributions once
        run: uv run --locked just build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: distributions
        with:
          name: distributions-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  check:
    needs: build
    # Required checks must fail, rather than skip, if the shared build failed.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        include:
          - os: ubuntu-24.04
            test-recipe: coverage
          - os: macos-15
            test-recipe: test
          - os: windows-2025
            test-recipe: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Require successful distribution build
        if: needs.build.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "pyproject.toml"
          python-version: "3.14"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Validate, test, and install the shared distributions
        run: uv run --locked just check ${{ matrix.test-recipe }} check-dist
      - name: Retain coverage even when later checks fail
        if: ${{ !cancelled() && runner.os == 'Linux' && hashFiles('coverage/cobertura.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/cobertura.xml
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Exercise native setup and Cargo updates from the built wheel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --no-sync --no-python-downloads just check-setup

  codecov:
    name: Upload coverage
    needs: [build, check]
    # Upload the Linux report even if a later native check failed.
    # Release validation retains reports but does not depend on Codecov availability.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref_type != 'tag' && github.repository == 'acgetchell/research-repo-tools' }}
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/codecov.yml

  changelog-integration:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful distribution build
        if: needs.build.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "pyproject.toml"
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Validate, install the pinned generator, and exercise source and installed contracts
        run: uv run --locked just check changelog-setup changelog-test check-dist-changelog

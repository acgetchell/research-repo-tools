name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'acgetchell/research-repo-tools' &&
      !github.event.release.draft &&
      !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the release commit on main and an unchanged tag
        run: |
          git --no-pager merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(git --no-pager rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
      - name: Verify the release assets against signed validation provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_assets.py verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: distributions
        with:
          name: verified-release-distributions-${{ github.run_attempt }}
          path: verified-dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/research-repo-tools
    permissions:
      id-token: write # Exchange this job's identity for short-lived PyPI credentials.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Publish validated release assets with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

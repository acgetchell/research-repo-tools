name: Approve Dependabot updates

on:
  workflow_call:
    inputs:
      repository:
        description: Exact owner/repository allowed to call this workflow
        required: true
        type: string
      policy:
        description: JSON map of uv/cargo/github_actions ecosystems to exact file allowlists
        required: true
        type: string

permissions: {}

jobs:
  approve:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.repository == inputs.repository &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The caller and this workflow run from trusted base-branch definitions.
      # Never check out PR code or pass repository secrets to this workflow.
      - name: Read signed Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          skip-verification: false
          skip-commit-verification: false

      - name: Approve an eligible current head
        id: approve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          POLICY: ${{ inputs.policy }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e --arg sha "$PR_HEAD_SHA" --arg repo "$REPOSITORY" --arg base "$DEFAULT_BRANCH" '
            .state == "open" and .draft == false and .user.login == "dependabot[bot]" and
            .head.sha == $sha and .head.repo.full_name == $repo and
            .base.repo.full_name == $repo and .base.ref == $base
          ' <<< "$pr" > /dev/null; then
            echo "::error::PR identity, target, or head changed."
            exit 1
          fi

          branch="$(jq -rn --arg branch "$DEFAULT_BRANCH" '$branch | @uri')"
          rules="$(gh api --paginate --slurp "repos/$REPOSITORY/rules/branches/$branch?per_page=100")"
          if ! jq -e '
            add | any(.[]; .type == "pull_request" and
              .parameters.required_approving_review_count >= 1 and
              .parameters.dismiss_stale_reviews_on_push == true and
              .parameters.required_review_thread_resolution == true) and
            any(.[]; .type == "required_status_checks" and
              .parameters.strict_required_status_checks_policy == true and
              (.parameters.required_status_checks | length) > 0)
          ' <<< "$rules" > /dev/null; then
            echo "::error::Require active rulesets with approvals, stale dismissal, resolved threads, and strict checks."
            exit 1
          fi

          # fetch-metadata reads the first commit. Later commits may only be
          # GitHub-signed base merges that preserve the original update below.
          commits="$(gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100")"
          if ! jq -e --arg sha "$PR_HEAD_SHA" --argjson count "$(jq '.commits' <<< "$pr")" '
            def sha: type == "string" and test("^[0-9a-f]{40}$");
            add | length > 0 and length == $count and .[-1].sha == $sha and
            .[0].author.login == "dependabot[bot]" and (.[0].parents | length == 1) and
            all(.[]; (.sha | sha) and .committer.login == "web-flow" and
              .commit.verification.verified == true and all(.parents[]; .sha | sha))
          ' <<< "$commits" > /dev/null; then
            echo "::error::Expected a complete GitHub-signed Dependabot commit chain at the event head."
            exit 1
          fi
          if ! jq -e '
            add | . as $commits | all(range(1; length);
              . as $index | $commits[$index] |
              (.parents | length == 2) and .parents[0].sha == $commits[$index - 1].sha)
          ' <<< "$commits" > /dev/null; then
            echo "Manual review required: additional commits are not base merges."
            exit 0
          fi
          base_sha="$(jq -r '.base.sha' <<< "$pr")"
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid base commit."
            exit 1
          fi
          while IFS= read -r parent; do
            comparison="$(gh api "repos/$REPOSITORY/compare/$parent...$base_sha")"
            if ! jq -e --arg parent "$parent" '
              (.status == "ahead" or .status == "identical") and .merge_base_commit.sha == $parent
            ' <<< "$comparison" > /dev/null; then
              echo "Manual review required: merged parent is not on the current base branch."
              exit 0
            fi
          done < <(jq -r 'add | .[1:][].parents[1].sha' <<< "$commits")

          # Dependabot configuration owns dependency/version eligibility. Do not
          # duplicate its allow/ignore, grouping, or security-update policies here.
          if ! jq -en --argjson deps "$DEPENDENCIES" --argjson policy "$POLICY" '
            ($deps | type == "array" and length > 0) and
            all($deps[];
              . as $dep | $policy[$dep.packageEcosystem] as $allowed |
              (["uv", "cargo", "github_actions"] | index($dep.packageEcosystem)) != null and
              $dep.packageEcosystem == $deps[0].packageEcosystem and
              ($dep.dependencyName | type == "string" and length > 0) and
              ($allowed.files | type == "array" and length > 0))
          ' > /dev/null; then
            echo "Manual review required: missing metadata or unsupported dependency ecosystem."
            exit 0
          fi

          ecosystem="$(jq -r '.[0].packageEcosystem' <<< "$DEPENDENCIES")"
          files="$(gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")"
          if ! jq -e --argjson policy "$POLICY" --arg ecosystem "$ecosystem" \
            --argjson count "$(jq '.changed_files' <<< "$pr")" '
            add | length > 0 and length == $count and all(.[];
              . as $file | .status == "modified" and
              ($policy[$ecosystem].files | index($file.filename)) != null)
          ' <<< "$files" > /dev/null; then
            echo "Manual review required: changed files are outside the dependency file policy."
            exit 0
          fi

          if [[ "$(jq 'add | length' <<< "$commits")" != 1 ]]; then
            original_sha="$(jq -r 'add | .[0].sha' <<< "$commits")"
            original="$(gh api --paginate --slurp "repos/$REPOSITORY/commits/$original_sha?per_page=100")"
            if ! jq -en --arg sha "$original_sha" --argjson original "$original" --argjson files "$files" '
              def entries: map({filename, status, sha}) | sort_by(.filename);
              ($original | length > 0 and all(.[]; .sha == $sha)) and
              ($files | add | all(.[]; .sha | type == "string" and test("^[0-9a-f]{40}$"))) and
              ([$original[].files[]] | entries) == ($files | add | entries)
            ' > /dev/null; then
              echo "Manual review required: base merges changed the original Dependabot update."
              exit 0
            fi
          fi

          reviews="$(gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100")"
          approved="$(jq -r --arg sha "$PR_HEAD_SHA" '
            [.[][] | select(.user.login == "github-actions[bot]" and .commit_id == $sha)] |
            sort_by(.id) | last | .state == "APPROVED"
          ' <<< "$reviews")"
          snapshot='[.head.sha, .base.sha, .base.ref, .base.repo.full_name, .state, .draft] | @json'
          expected="$(jq -r "$snapshot" <<< "$pr")"
          current="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq "$snapshot")"
          if [[ "$current" != "$expected" ]]; then
            echo "::error::PR head, base, or reviewability changed before approval."
            exit 1
          fi
          if [[ "$approved" != true ]]; then
            gh api --method POST "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" \
              --raw-field commit_id="$PR_HEAD_SHA" --raw-field event=APPROVE \
              --raw-field body='Approved by the Dependabot policy. Required checks and review threads still gate merging.' \
              --silent
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Enable native auto-merge for the approved head
        if: steps.approve.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash \
            --match-head-commit "$PR_HEAD_SHA"

name: Dependabot approval and auto-merge

# Trusted base-branch policy only; the reusable job never checks out or runs PR code.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve-and-enable-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    # Pinned actionlint does not yet recognize the equivalent $/ syntax.
    uses: ./.github/workflows/dependabot-approve.yml # zizmor: ignore[self-repository]
    with:
      repository: acgetchell/research-repo-tools
      policy: >-
        {"uv": {
          "dependencies": [
            "hatchling", "packaging", "pyyaml", "rust-just",
            "ipykernel", "nbclient", "nbformat", "actionlint-py",
            "coverage", "pytest", "pytest-cov", "ruff", "ty", "zizmor", "pip-audit"
          ],
          "files": ["pyproject.toml", "uv.lock"]
        }}

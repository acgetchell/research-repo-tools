name: Dependabot approval and auto-merge

# Trusted base-branch policy only; the reusable job never checks out or runs PR code.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve-and-enable-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    # Pinned actionlint does not yet recognize the equivalent $/ syntax.
    uses: ./.github/workflows/dependabot-approve.yml # zizmor: ignore[self-repository]
    with:
      repository: acgetchell/research-repo-tools
      policy: >-
        {"github_actions": {
          "files": [
            ".github/workflows/audit.yml", ".github/workflows/ci.yml",
            ".github/workflows/codecov.yml", ".github/workflows/codeql.yml",
            ".github/workflows/dependabot-approve.yml", ".github/workflows/dependabot-auto-merge.yml",
            ".github/workflows/prepare-release.yml", ".github/workflows/publish.yml",
            ".github/workflows/zizmor.yml"
          ]
        }, "uv": {
          "files": ["pyproject.toml", "uv.lock"]
        }}

name: Prepare GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: prepare-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'acgetchell/research-repo-tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on the protected main branch
        run: |
          git --no-pager merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(git --no-pager rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: "pyproject.toml"
          python-version-file: ".python-version"
      - name: Check tag, metadata, and generated release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked just changelog-check release-check "$RELEASE_TAG"
      - name: Audit locked Python dependencies
        run: uv run --locked --group audit just audit

  stage:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # Create a draft release and attach the validated distributions.
      actions: read # Retrieve exact main-run artifacts by immutable identity.
      attestations: write
      id-token: write # Sign the validated files; no PyPI environment in this workflow.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retrieve and verify signed exact-commit main validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_assets.py promote "$RELEASE_TAG"
      - name: Sign promotion of the same validated distributions
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          predicate-type: https://github.com/acgetchell/research-repo-tools/attestations/release-promotion/v1
          predicate-path: promotion.json
          create-storage-record: false
      - name: Create a draft release with the validated assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: python3 scripts/release_assets.py stage "$RELEASE_TAG" --bundle "$ATTESTATION_BUNDLE"

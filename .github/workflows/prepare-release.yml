name: Prepare GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'acgetchell/research-repo-tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on the protected main branch
        run: git --no-pager merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: "pyproject.toml"
          python-version: "3.14"
      - name: Check tag, metadata, and generated release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked just changelog-check release-check "$RELEASE_TAG"
      - name: Audit locked Python dependencies
        run: uv run --locked --group audit just audit

  validate:
    needs: preflight
    # The reusable workflow declares an OIDC upload job, skipped for release tags.
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/ci.yml

  stage:
    needs: [preflight, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Create a draft release and attach the validated distributions.
      attestations: write
      id-token: write # Sign the validated files; no PyPI environment in this workflow.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Sign distributions only after all validation succeeds
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          create-storage-record: false
      - name: Create a draft release with the validated assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: python3 scripts/release_assets.py stage "$RELEASE_TAG" --bundle "$ATTESTATION_BUNDLE"

version: 2
# The hosted uv updater rejects requires-python >=3.15 (tool_version_not_supported).
# Restore the uv entry when Dependabot supports this runtime. Until then use
# just update-python-dependencies; the scheduled dependency audit stays enabled.
# GitHub's independent automatic graph jobs still need upstream 3.15 support.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels: [dependencies, github-actions]
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

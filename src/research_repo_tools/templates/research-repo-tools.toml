# Standalone config: research-repo-tools --config research-repo-tools.toml ...
# In pyproject.toml, prefix these tables with tool.research-repo-tools.
schema = 1

# Toolchain setup also reads the consumer pyproject.toml [tool.uv] required-version,
# .python-version, and rust-toolchain.toml. See docs/INSTALLING.md.
# [toolchain.cargo]
# git-cliff = "2.14.1"

[changelog]
# Shared changelog commands always use CHANGELOG.md in the repository root.
# Changelog archives always live in docs/archives/changelog/.
owner = "__OWNER__"
repository = "__REPOSITORY__"
# Optional final lint/format gate using this repository's rules:
# formatter = "rumdl.toml"
# Optional custom git-cliff policy instead of the packaged template:
# cliff-config = "cliff.toml"

[deps]
pyproject = "pyproject.toml"
justfile = "justfile"
# [deps.tools]
# git_cliff_version = "git-cliff"
# rumdl_version = "rumdl"

[notebooks]
group = "notebook"
cwd = "."
output-dir = "target/notebooks"
timeout = 600
outputs = "clear"

# Optional consumer publication assertions and selected active references.
# See docs/UPDATING_RELEASE_METADATA.md and docs/release-policy-migration.md.
# [release]
# required-files = ["CITATION.cff", "README.md", "REFERENCES.md"]
# exclude = ["docs/evidence/**"]
# [[release.rules]]
# path = "CITATION.cff"
# pattern = '^doi: (?P<value>[^\s]+)[ \t]*\r?$'
# value = "10.1234/your-concept-doi"

# Declare the scanner pin in dependency-groups.dev OR toolchain.cargo.
[zizmor]
persona = "regular"
timeout = 300

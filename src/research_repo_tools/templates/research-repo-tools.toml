# Standalone config: research-repo-tools --config research-repo-tools.toml ...
# In pyproject.toml, prefix these tables with tool.research-repo-tools.
schema = 1

# Toolchain setup also reads the consumer pyproject.toml [tool.uv] required-version,
# .python-version, and rust-toolchain.toml. See docs/INSTALLING.md.
# [toolchain]
# The published Python minimum is mandatory for application metadata without a setting.
# Optionally mirror the selected development interpreter as well:
# inherit-python = true
# Inherit Ruff/ty/pytest pins through the installed python-tools extra independently.
# inherit-python-tools = true
# [toolchain.binaries]
# dprint = "0.60.1"
# gitleaks = "8.30.1"
# osv-scanner = "2.6.0"
# rumdl = "0.2.78"
# [toolchain.cargo]
# cargo-deny = "0.20.2"
# git-cliff = "2.14.1"

[changelog]
# Shared changelog commands always use CHANGELOG.md in the repository root.
# Changelog archives always live in docs/archives/changelog/.
owner = "__OWNER__"
repository = "__REPOSITORY__"
# Optional final lint/format gate using this repository's rules:
# formatter = "rumdl.toml"
# Optional custom git-cliff policy instead of the packaged template:
# cliff-config = "cliff.toml"
# dependency-bodies = "preserve" # Keep authored dependency detail with the shared template.

[deps]
pyproject = "pyproject.toml"
justfile = "justfile"
# [deps.tools]
# User-installed tools only; do not map tools also in toolchain.cargo/binaries.
# git_cliff_version = "git-cliff"
# rumdl_version = "rumdl"
# [deps.tool-owners]
# git-cliff = "cargo"
# rumdl = "homebrew"

[notebooks]
group = "notebook"
cwd = "."
output-dir = "target/notebooks"
timeout = 600
outputs = "clear"
# prohibit-installs = true
# Optional full-match policy for lowercase kebab-case IDs:
# id-pattern = '[a-z0-9]+(?:-[a-z0-9]+)*'

[notebooks.lab]
browser = false
scratch-dir = "target/jupyter"

[notebooks.reset]
sources = []
scratch = []
checkpoints = []

# Optional consumer publication assertions and selected active references.
# See docs/UPDATING_RELEASE_METADATA.md and docs/release-policy-migration.md.
# [release]
# required-files = ["CITATION.cff", "README.md", "REFERENCES.md"]
# exclude = ["docs/evidence/**"]
# [[release.rules]]
# path = "CITATION.cff"
# pattern = '^doi: (?P<value>[^\s]+)[ \t]*\r?$'
# value = "10.1234/your-concept-doi"

# Optional SARIF selection. Driver names are exact; [] keeps all rule IDs.
# [sarif]
# category-prefix = "analysis"
# [sarif.drivers]
# "Scanner" = ["project."]

# Semgrep scan policy; repository-owned rules and exclusions remain local.
# [semgrep]
# batch-size = 100
# config = "semgrep.yaml"
# inline-suppressions = false
# jobs = 1
# report-category = "semgrep"
# report-layout = "aggregate"
# target-timeout = 120
# timeout = 300

# Declare the scanner pin in dependency-groups.dev OR toolchain.cargo.
[zizmor]
persona = "regular"
timeout = 300

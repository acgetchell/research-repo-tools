# Consumer-owned example for one root crate. Requires the supplying v0.2.9 release.
# Pin its exact published version in the locked tooling group; configure publishing
# and release.published-dependencies = ["research-repo-tools"]. The release gate
# rechecks dependency provenance before provider access and credential acquisition.
# Extend native commands/features and required checks for your crate/workspace.
# Metadata, existing changelog notes and registry checks need only the locked
# tooling package plus runner Git/gh. Packaging/upload selects minimal pinned
# Rust/Cargo, without contributor tools, extra components or cross targets.
# Provision your crate's compiler/linker and native libraries before packaging.
# The 20-minute budgets cover tooling bootstrap, minimal Rust setup and one
# Cargo package build per job; measure cold/warm hosted runs before adoption
# and adjust for your crate. These budgets are not measured completion times.
name: Publish to crates.io

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == '__OWNER__/__REPOSITORY__' &&
      !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
      - name: Bootstrap the exact locked tooling package
        run: uv sync --locked --managed-python --only-group tooling
      - name: Require reviewed release identity and successful exact-commit checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --locked --no-sync research-repo-tools release gate "$RELEASE_TAG"
      - name: Install only pinned Rust and Cargo
        run: uv run --locked --no-sync research-repo-tools toolchain sync --tool cargo
      - name: Verify Cargo packaging without uploading
        run: uv run --locked --no-sync research-repo-tools toolchain run --tool cargo -- cargo publish --dry-run --locked --registry crates-io

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io # Register this exact workflow filename and environment.
    permissions:
      contents: read
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
      - name: Bootstrap the exact locked tooling package
        run: uv sync --locked --managed-python --only-group tooling
      - name: Install only pinned Rust and Cargo
        run: uv run --locked --no-sync research-repo-tools toolchain sync --tool cargo
      - name: Recheck evidence and registry absence after deployment approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --locked --no-sync research-repo-tools release gate "$RELEASE_TAG"
          uv run --locked --no-sync research-repo-tools release registry "$RELEASE_TAG" --expect absent
      - name: Obtain a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Package, verify, and upload the reviewed source with Cargo
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: uv run --locked --no-sync research-repo-tools toolchain run --tool cargo -- cargo publish --locked --registry crates-io
      - name: Check visibility even after Cargo reports a post-upload timeout
        if: ${{ !cancelled() && steps.auth.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --locked --no-sync research-repo-tools release verify "$RELEASE_TAG" --attempts 7 --interval 10

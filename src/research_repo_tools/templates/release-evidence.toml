# Replace every job/step with the consumer's actual exact native gates.
schema = 1
repository = "__OWNER__/__REPOSITORY__"
package = "your-package"
workflow = ".github/workflows/ci.yml"
workflow-name = "CI"
branch = "main"
artifact-prefix = "release-evidence"
guarantee = "signed-source"
# Cargo archive policies use guarantee = "cargo-archive". Retain validation.json
# and PACKAGE-VERSION.crate, with independently observed cargo/rustc tool strings.
# Signing remains optional for Cargo archives and mandatory for signed-source.
path-in-vcs = ""
# Optional explicit identity: "python" ignores a colocated Cargo workspace;
# "cargo" requires Cargo metadata. Omission preserves Cargo-first detection.
# package-kind = "python"
# For Python wheel/sdist evidence set guarantee = "python-distributions",
# package-kind = "python", remove [signing-job] if signatures are not required,
# and add this table (the package must match the configured filename prefix):
# [distributions]
# files = ["your_package-{version}-py3-none-any.whl", "your_package-{version}.tar.gz"]
# index-url = "https://pypi.org"
# max-age-seconds = 2592000
# Declare every build/native installed/security gate below. Retain the exact
# distributions with validation.json only after those gates succeed.

[[jobs]]
name = "linux"
steps = ["Native checks"]
runner-labels = ["ubuntu-latest"]

[[jobs]]
name = "macos"
steps = ["Native checks"]
runner-labels = ["macos-latest"]

[[jobs]]
name = "windows"
steps = ["Native checks"]
runner-labels = ["windows-latest"]

[[jobs]]
name = "package"
steps = ["Default and exact archive checks"]

[signing-job]
name = "sign"
steps = ["Capture", "Sign", "Upload"]

# Consumer workflow: scanner pin and persona live in pyproject.toml.
# This uses the zizmor-check recipe from the packaged justfile.
name: zizmor

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # Required by upload-sarif for private repositories.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: pyproject.toml
      # Python-pinned scanners are installed by uv run. A Cargo-pinned scanner
      # needs the consumer's existing managed setup before this step; see the guide.
      - name: Fail on workflow findings
        id: audit
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --group dev just zizmor-check --require-online
      - name: Produce SARIF even when the finding gate fails
        id: sarif
        if: ${{ !cancelled() && steps.audit.outcome != 'skipped' }}
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --group dev just zizmor-check --require-online --format sarif > "$RUNNER_TEMP/zizmor.sarif"
      # Fork and Dependabot runs keep the audit gate but skip privileged upload.
      - name: Upload security findings
        if: ${{ !cancelled() && steps.sarif.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor

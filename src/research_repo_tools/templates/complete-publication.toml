# Edit named views, semantic IDs, coordinates and independent provenance pins.
# Scientific eligibility stays consumer-owned.
# Set measurement = "tooling/measurement-full.toml" to enforce that policy,
# including live source/harness membership and hashes for document publication.
# Set formatter = ".rumdl.toml" to format and check before replacing any output.
# For reusable identities, omit release/revision from the provenance tables and
# pass paired --baseline-release/--baseline-revision and --current-release/
# --current-revision assertions. Static assertions cannot be overridden.
# Add label-version = "release" or "dependency.reference" to a series to append
# the version captured in that series' original phase.
# --artifacts-only renders the configured figures/CSV without editing a document.
schema = 2
document = "README.md"
archive = "docs/performance-runs"
# Alternatively replace archive with BOTH payload and manifest paths.
# Explicit scratch inputs never fall back to older retained history.
begin = "<!-- BENCHMARKS:BEGIN -->"
end = "<!-- BENCHMARKS:END -->"
statistic = "median"
unit = "ns"
missing = "error"
csv = "docs/assets/timings.csv"
# Optional point-ratio SVG requires exactly one comparisons entry.
svg = "docs/assets/ratios.svg"
rows = [
    {key = "two", label = "Dimension 2", coordinate = 2},
    {key = "eight", label = "Dimension 8", coordinate = 8},
]
series = [
    {name = "Library baseline", label = "Library baseline", rows = {two = "library / 2", eight = "library / 8"}},
    {name = "Library current", label = "Library current", rows = {two = "library / 2", eight = "library / 8"}},
    {name = "Reference reused", label = "Reference", rows = {two = "reference / 2", eight = "reference / 8"}},
]
comparisons = [{numerator = "Library baseline", denominator = "Library current"}]

# Optional compact Markdown style; omit to preserve inline intervals and both columns.
# [table]
# comparison-columns = ["ratio"]
# intervals = "below"
# ratio-headings = ["Baseline / current"]
# ratio-suffix = "×"
# row-heading = "Dimension"
# timing-legend = true

[plot]
path = "docs/assets/dimensions.svg"
title = "Timing versus dimension"
x-label = "Dimension"
y-label = "Timing"
x-scale = "linear"
y-scale = "log"

[provenance.baseline]
revision = "0000000000000000000000000000000000000000"
release = "v1.1.0"

[provenance.current]
revision = "0000000000000000000000000000000000000000"
release = "v1.2.0"

[[references]]
path = "Cargo.toml"
pattern = '^version\s*=\s*"(?P<value>[^"]+)"\r?$'
source = "version"

[[references]]
path = "docs/releases.md"
pattern = '^Baseline: (?P<value>[^\r\n]+)'
source = "previous-tag"

[[references]]
path = "docs/releases.md"
pattern = '^Current: (?P<value>[^\r\n]+)'
source = "tag"
